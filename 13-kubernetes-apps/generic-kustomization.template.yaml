apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This helmCharts block renders the generic chart with application-specific values.
helmCharts:
  - name: generic-app-chart
    # Path to the generic chart relative to the application's kustomization.yaml
    repo: "file://../../../generic-app-chart"
    releaseName: ${APP_NAME}
    valuesFile: ${VALUES_FILE}