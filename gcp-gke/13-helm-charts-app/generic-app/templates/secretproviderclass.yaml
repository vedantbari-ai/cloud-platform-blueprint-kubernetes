{{- if .Values.secretManager.enabled -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "generic-app.fullname" . }}-secretproviderclass
  namespace: {{ .Values.namespace.name }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range .Values.secretManager.secrets }}
      - resourceName: "projects/{{ $.Values.gcpProject }}/secrets/{{ .secretId }}/versions/latest"
        path: "{{ .key }}"
      {{- end }}
{{- end }}