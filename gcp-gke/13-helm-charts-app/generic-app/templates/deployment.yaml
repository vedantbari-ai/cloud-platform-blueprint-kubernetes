apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
spec:
  # Omit replicas if HPA is managing scaling to prevent fighting
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "generic-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "generic-app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "generic-app.serviceAccountName" . }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: http
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          
          # Dynamically load ConfigMaps and Secrets
          {{- if or .Values.envFromSecrets .Values.configMap.enabled .Values.secret.enabled }}
          envFrom:
            {{- if .Values.configMap.enabled }}
            - configMapRef:
                name: {{ include "generic-app.fullname" . }}-config
            {{- end }}
            {{- if .Values.secret.enabled }}
            - secretRef:
                name: {{ include "generic-app.fullname" . }}-secret
            {{- end }}
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ .secretName }}
            {{- end }}
          {{- end }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
            
          # --- COMBINED VOLUME MOUNTS (Persistence + Secret Manager CSI) ---
          {{- if or .Values.persistence.enabled .Values.secretManager.enabled }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: file-storage
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.secretManager.enabled }}
            - name: secrets-store
              mountPath: "/mnt/secrets"
              readOnly: true
            {{- end }}
          {{- end }}
          # ----------------------------------------------------------------

          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: {{ .Values.probes.startup.port }}
            failureThreshold: 30
            periodSeconds: 10
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- end }}

      # --- COMBINED VOLUMES (Persistence + Secret Manager CSI) ---
      {{- if or .Values.persistence.enabled .Values.secretManager.enabled }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: file-storage
          persistentVolumeClaim:
            claimName: {{ include "generic-app.fullname" . }}-pvc
        {{- end }}
        {{- if .Values.secretManager.enabled }}
        - name: secrets-store
          csi:
            driver: {{ .Values.secretManager.driver | default "secrets-store-gke.csi.k8s.io" }}
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "generic-app.fullname" . }}-secretproviderclass
        {{- end }}
      {{- end }}
      # -----------------------------------------------------------