controller:
  component: "jenkins-master"

  image:
    registry: "docker.io"
    repository: "jenkins/jenkins"
    tag: "latest-jdk21"

  javaOpts: "-Djenkins.install.runSetupWizard=false"

  serviceType: "ClusterIP"

  testEnabled: false

  admin:
    username: "admin"
    password: "adminPassword123"

  ingress:
    enabled: true
    ingressClassName: "gce"

  persistence:
    enabled: true
    storageClass: "standard"
    size: 20Gi

  startupProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

  readinessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12

  livenessProbe:
    enabled: true
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - credentials
    - job-dsl

  JCasC:
    defaultConfig: false
    configScripts:
      jenkins-automation-config: |
        jenkins:
          securityRealm:
            local:
              allowsSignup: false
              users:
                - id: "$${controller.admin.username}"
                  password: "$${controller.admin.password}"

          authorizationStrategy:
            loggedInUsersCanDoAnything:
              allowAnonymousRead: false

          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "${cluster_endpoint}"
                credentialsId: ""
                serverCertificate: "${cluster_ca_certificate}"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                containerCapStr: "10"

                templates:
                  - name: "docker-agent"
                    label: "docker-agent"
                    namespace: "jenkins"

                    yaml: |
                      apiVersion: v1
                      kind: Pod

                      metadata:
                        labels:
                          app: jenkins-docker-agent

                      spec:
                        restartPolicy: Never

                        containers:
                          - name: jnlp
                            image: jenkins/inbound-agent:latest
                            workingDir: /home/jenkins/agent

                          - name: docker
                            image: docker:27-cli
                            command:
                              - cat
                            tty: true
                            env:
                              - name: DOCKER_HOST
                                value: tcp://localhost:2375

                          - name: docker-dind
                            image: docker:27-dind
                            securityContext:
                              privileged: true
                            env:
                              - name: DOCKER_TLS_CERTDIR
                                value: ""
                            ports:
                              - name: docker
                                containerPort: 2375
                            volumeMounts:
                              - name: docker-storage
                                mountPath: /var/lib/docker

                        volumes:
                          - name: docker-storage
                            emptyDir: {}

agent:
  enabled: false