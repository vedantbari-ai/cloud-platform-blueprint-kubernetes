controller:
  component: "jenkins-master"

  image:
    registry: "docker.io"
    repository: "jenkins/jenkins"
    tag: "2.579"

  javaOpts: "-Djenkins.install.runSetupWizard=false"
  serviceType: "ClusterIP"

  admin:
    username: "admin"
    password: "adminPassword123"

  ingress:
    enabled: true
    ingressClassName: "gce"

  persistence:
    enabled: true
    storageClass: "standard"
    size: 20Gi

  installPlugins:
    - "kubernetes:4253.v7700d91739e5"
    - "workflow-aggregator:600.vb_57cdd26fdd7"
    - "git:5.2.2"
    - "configuration-as-code:2053.vb_0da_47381a_25"
    - "credentials:1511.v2e3cb_0008ef0"

  JCasC:
    defaultConfig: true
    configScripts:
      jenkins-security: |
        jenkins:
          securityRealm:
            local:
              allowsSignup: false
              users:
                - id: "${controller.admin.username}"
                  password: "${controller.admin.password}"
          authorizationStrategy:
            loggedInUsersCanDoAnything:
              allowAnonymousRead: false

      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                containerCapStr: "10"
                templates:
                  - name: "docker-agent"
                    namespace: "jenkins"
                    label: "docker-agent"
                    idleMinutes: 0
                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:latest"
                        workingDir: "/home/jenkins/agent"
                      - name: "docker"
                        image: "docker:git"
                        command: "cat"
                        ttyEnabled: true
                        privileged: true
                        workingDir: "/home/jenkins/agent"
                    volumes:
                      - hostPathVolume:
                          hostPath: "/var/run/docker.sock"
                          mountPath: "/var/run/docker.sock"

agent:
  enabled: true