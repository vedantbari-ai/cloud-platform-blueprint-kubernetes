# ==============================================================================
# GCP PLATFORM CONFIGURATION: CLIENT-A (DEV ENVIRONMENT - MUMBAI)
# ==============================================================================

client:
  name: "client-a"

environment: "dev"

gcp:
  project_id: "eks-terraform"   # Replace with your actual GCP Project ID
  region: "asia-south1"
  zone: "asia-south1-a"
  tags:
    env: "dev"
    client: "client-a"
    managed-by: "terragrunt"
    owner: "platform-engineering"

# Dedicated Bootstrap Configuration Section
bootstrap:
  state_bucket_name: "nuclesteq-gcp-tf-state-client-a-dev" # Must be globally unique in GCP

# VPC & Networking Configuration across Mumbai Zones
vpc:
  create: true
  vpc_name: "client-a-dev-vpc"
  network_cidr: "10.100.0.0/16"
  subnets:
    - name: "private-gke-subnet-a"
      cidr: "10.100.0.0/20"
      region: "asia-south1"
      zone: "asia-south1-a"
    - name: "private-gke-subnet-b"
      cidr: "10.100.16.0/20"
      region: "asia-south1"
      zone: "asia-south1-b"
  pod_range_name: "pods-range"
  pod_range_cidr: "10.1.0.0/16"
  svc_range_name: "services-range"
  svc_range_cidr: "10.2.0.0/16"

# Google Kubernetes Engine (GKE) Cluster Specifications
gke:
  cluster_name: "gke-client-a-dev"
  cluster_version: "1.35.6-gke.1710000"
  release_channel: "regular"
  machine_type: "e2-standard-4"
  node_count: 2
  disk_size_gb: 50
  enable_autoscaling: true
  min_nodes: 1
  max_nodes: 5
  delete_protection: false
  cluster_addons:
    http_load_balancing: true
    horizontal_pod_autoscaling: true
    gce_csi_driver: true

# Shared Storage Configuration (Cloud Filestore / NFS)
storage:
  filestore:
    create: true
    tier: "STANDARD"
    file_share_name: "shared_vol"
    capacity_gb: 1024