releaseName: frontend-web

namespace:
  create: true
  name: dev-frontend

serviceAccount:
  create: true

image:
  repository: nginx
  tag: "alpine"
  pullPolicy: IfNotPresent

service:
  enabled: true
  port: 80
  targetPort: 80
  type: ClusterIP

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

persistence:
  enabled: true
  storageClassName: "standard-rwx"
  accessMode: ReadWriteMany
  size: 10Gi
  mountPath: /usr/share/nginx/html

configMap:
  enabled: true
  data:
    APP_THEME: "dark"
    LOG_LEVEL: "debug"

secret:
  enabled: true
  data:
    API_KEY: "super-secret-key-123"
    DB_PASSWORD: "secure-db-password"

env:
  - name: STATIC_ENV_VAR
    value: "I am set directly in the deployment"

probes:
  startup:
    enabled: true
    path: /
    port: 80
  readiness:
    enabled: true
    path: /
    port: 80
  liveness:
    enabled: true
    path: /
    port: 80

securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi