# Production-Grade Observability Configuration for client-b
monitoring:
  fullnameOverride: monitoring
  defaultRules:
    create: true
  
  alertmanager:
    enabled: true
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: "standard-rwo"
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi

  kube-state-metrics:
    enabled: true          # <--- Enabled for deployment and workload metrics

  prometheus-node-exporter:
    enabled: true

  grafana:
    enabled: true
    replicas: 2                # <--- High availability for Grafana (Production grade)
    defaultDashboardsEnabled: true
    defaultDashboardsEditable: false
    defaultDashboardsTimezone: browser
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        isDefault: false
    persistence:
      enabled: true
      storageClassName: "standard-rwo"
      accessModes:
        - ReadWriteOnce
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  prometheus:
    enabled: true
    prometheusSpec:
      replicas: 2              # <--- High availability for Prometheus server
      retention: "7d"          # <--- Production retention (7 days)
      retentionSize: "15GB"
      scrapeInterval: "15s"
      # resources:
      #   requests:
      #     cpu: 500m
      #     memory: 1Gi
      #   limits:
      #     cpu: 2000m
      #     memory: 4Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: "standard-rwo"
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi

loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    storage:
      type: filesystem
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 168h  # <--- 7 days log retention
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: "standard-rwo"
      accessModes:
        - ReadWriteOnce
      size: 50Gi              # <--- Larger production disk for logs
    # resources:
    #   requests:
    #     cpu: 250m
    #     memory: 512Mi
    #   limits:
    #     cpu: 1000m
    #     memory: 2Gi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

alloy:
  fullnameOverride: alloy-logs
  controller:
    type: daemonset           # <--- DaemonSet ensures log collection on every worker node
    replicas: 1
  rbac:
    create: true
    rules:
      - apiGroups: [""]
        resources: ["pods", "pods/log", "namespaces", "events", "services", "endpoints"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["events.k8s.io"]
        resources: ["events"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
        verbs: ["get", "list", "watch"]
  alloy:
    configMap:
      content: |-
        logging {
          level  = "info"
          format = "logfmt"
        }

        # --- Pod and Deployment Logs Discovery ---
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          # Extract Namespace
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          # Extract Pod Name
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          # Extract App/Container Name
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          # Extract Deployment / Controller Name (e.g., ReplicaSet -> Deployment)
          rule {
            source_labels = ["__meta_kubernetes_pod_controller_name"]
            target_label  = "controller_name"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.default.receiver]
        }

        # --- Kubernetes Cluster & Namespace Events Pipeline ---
        loki.source.kubernetes_events "cluster_events" {
          forward_to = [loki.write.default.receiver]
        }

        # --- Shared Loki Writer Endpoint ---
        loki.write "default" {
          endpoint {
            url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }
    # resources:
    #   requests:
    #     cpu: 100m
    #     memory: 128Mi
    #   limits:
    #     cpu: 500m
    #     memory: 256Mi